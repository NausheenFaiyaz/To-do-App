<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>To-do list</title>
  </head>
  <body>
    <div class="todo-container">
      <h1>Todo App</h1>

      <div class="user-panel">
        <div class="user-wrapper-pannel">
        <div class="create-user">
          <input
            type="text"
            placeholder="Enter username..."
            class="username-input"
          />
          <button class="create-user-btn">Create</button>
        </div>
        <div class="switch-user">
          <label for="userSelect">Current User</label>
          <select id="userSelect"></select>
          <button class="switch-user-btn">Switch</button>
        </div>
        </div>
        <p class="current-user"></p>
        <div class="admin-view-toggle" hidden>
          <button class="personal-view-btn">My Todos</button>
          <button class="admin-view-btn">Admin Preview</button>
        </div>
      </div>

      <div class="input-container">
        <input
          type="text"
          placeholder="Enter your todo..."
          class="todo-input"
        />
        <button class="addBtn">Add</button>
      </div>

      <ul class="todoList"></ul>
    </div>
    <script src="script.js"></script>
  </body>
</html>
